<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú RA - Demo Maracaibo</title>
    <!-- Script oficial de Model Viewer -->
    <script type="module" src="https://unpkg.com/@model-viewer/public@v3.4.0/dist/model-viewer.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        
        model-viewer {
            width: 100%;
            height: 320px;
            background-color: #0f172a;
            border-radius: 12px;
        }
        
        .ar-button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Hamburguesa Especial 🍔</h2>
        <p>Toca el botón para proyectar el plato en tu mesa a tamaño real.</p>
        
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
            alt="Plato 3D en RA" 
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            camera-controls 
            auto-rotate>
            
            <button slot="ar-button" class="ar-button">
                Ver en tu mesa (RA)
            </button>
        </model-viewer>
    </div>

</body>
</html>
